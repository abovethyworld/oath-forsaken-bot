name: Smoke suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The suite derives its test accounts from the files in
      # data/. Production data is never committed, so CI stages
      # the generated fake fixture set first.
      - name: Stage fixture data
        run: node tools/smoke-fixtures.js

      # The suite renders dozens of cards in seconds. Against the
      # production renderer that burst trips its rate limit and the
      # run fails on cards that are fine in normal use, so CI renders
      # against a local stub instead.
      - name: Start stub card service
        run: |
          node tools/card-stub.js &
          echo "CARD_API_URL=http://127.0.0.1:8799" >> "$GITHUB_ENV"

      - name: Run the smoke suite
        run: node tools/smoke-cards.js
