name: guards

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write blocklist outside the checkout
        env:
          NAME_BLOCKLIST: ${{ secrets.NAME_BLOCKLIST }}
        run: |
          if [ -n "$NAME_BLOCKLIST" ]; then
            printf '%s\n' "$NAME_BLOCKLIST" > "$RUNNER_TEMP/name-blocklist.txt"
            echo "BLOCKLIST_FILE=$RUNNER_TEMP/name-blocklist.txt" >> "$GITHUB_ENV"
          else
            echo "::warning::NAME_BLOCKLIST secret not set; name scan will be skipped (degraded mode)"
          fi

      - name: Run privacy guards
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          zeros=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            before=$PUSH_BEFORE
            if [ "$before" = "$zeros" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              # New branch or rewritten history: compare against the default branch if possible.
              if base=$(git merge-base "origin/$DEFAULT_BRANCH" "$PUSH_AFTER" 2>/dev/null); then
                before=$base
              else
                before=$(git hash-object -t tree /dev/null)
              fi
            fi
            range="$before..$PUSH_AFTER"
          fi
          echo "Scanning $range"
          bash deploy/ci-guard.sh --range "$range"
